name: Flex Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparer le jeu (main.py + images + sons uniquement)
        run: |
          mkdir game
          cp main.py game/
          cp $(ls *.png | grep -v '^pwa-') game/
          cp *.wav *.ogg game/
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pygbag
      - run: python -m pygbag --build game
      - name: Ajouter la page admin et la fiche d'application
        run: |
          cp admin.html game/build/web/admin.html
          cp skins_sheet.png game/build/web/skins_sheet.png
          cp manifest.webmanifest sw.js install.js pwa-icon-192.png pwa-icon-512.png game/build/web/
          python pwa_inject.py game/build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
