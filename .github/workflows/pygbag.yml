name: Flex Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Choisir le jeu le plus recent
        run: |
          best=$(for f in *.py; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Jeu utilise : $best"
          if [ "$best" != "main.py" ]; then cp -f "$best" main.py; fi
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pygbag
      - run: python -m pygbag --build .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
